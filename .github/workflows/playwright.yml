name: Playwright Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true # Changed to true to prevent older runs from conflicting

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.23.0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run Playwright tests
      run: pnpm exec playwright test
      env:
        HOME: /root

    # Consolidated: Upload everything as one artifact to be used by the deploy job
    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always() 
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  deploy:
    # Only run deploy if the test job finished (even if it failed, we want to see the report)
    needs: test
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Download test results
      uses: actions/download-artifact@v4
      with:
        name: playwright-report
        path: playwright-report # Downloads directly to this folder

    # Stop here if the artifact failed to download (i.e., tests crashed early)
    # This prevents the "upload empty folder" issue
    
    - name: Setup Pages
      if: success() # Only run if download worked
      uses: actions/configure-pages@v4

    - name: Upload to GitHub Pages
      if: success() 
      uses: actions/upload-pages-artifact@v3
      with:
        path: playwright-report/ # Upload the folder we just downloaded

    - name: Deploy to GitHub Pages
      id: deployment
      if: success()
      uses: actions/deploy-pages@v4